name: BankApp CI/CD

on:
  push:
    branches: [DevOps]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::747938282480:role/github-actions-bankapp-ecr
          aws-region: eu-west-1
       
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: bankapp-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region eu-west-1 \
            --name gurleen-eks-cluster

      - name: Check EKS connection
        run: |
          aws sts get-caller-identity
          kubectl config current-context
          kubectl get nodes

      - name: Create Kubernetes namespace
        run: |
          kubectl create namespace bankapp \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/
          
       # Then update the image to the latest build
      - name: Deploy to EKS
        env:
          IMAGE: 747938282480.dkr.ecr.eu-west-1.amazonaws.com/bankapp-backend:${{ github.sha }}
        run: |
           kubectl -n bankapp set image deployment/bankapp-backend \
              bankapp-backend=$IMAGE

      - name: Verify deployment
        run: | 
           kubectl -n bankapp rollout status deployment/bankapp-backend
      
        
             
        
