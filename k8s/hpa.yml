kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2

metadata:
  name: bankapp-hpa
  namespace: bankapp-ns

spec:
  scaleTargetRef:
    kind: Deployment
    apiVersion: apps/v1
    name: bankapp-deployment 

  minReplicas: 2
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
